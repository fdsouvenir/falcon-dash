name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      OPENCLAW_STATE_DIR: ${{ github.workspace }}/artifacts/plugin-v4/release-state
      OPENCLAW_CONFIG_PATH: ${{ github.workspace }}/artifacts/plugin-v4/release-config.json
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify exact release metadata
        run: node scripts/verify-release-metadata.mjs "$GITHUB_REF_NAME"

      - run: npm ci

      - name: Install pinned build SDK
        run: |
          npm install --prefix "$RUNNER_TEMP/falcon-sdk" --ignore-scripts --no-audit --no-fund openclaw@2026.9.3
          test -e node_modules/openclaw || ln -s "$RUNNER_TEMP/falcon-sdk/node_modules/openclaw" node_modules/openclaw

      - name: Build reviewed archive and checksum
        run: |
          npm run build
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.tgz
            release/SHA256SUMS
