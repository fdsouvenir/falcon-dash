name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      OPENCLAW_STATE_DIR: ${{ runner.temp }}/falcon-openclaw-state
      OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/falcon-openclaw-config.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned SDK and synthetic Vault prerequisite
        run: |
          npm install --prefix "$RUNNER_TEMP/falcon-sdk" --ignore-scripts --no-audit --no-fund openclaw@2026.9.2
          test -e node_modules/openclaw || ln -s "$RUNNER_TEMP/falcon-sdk/node_modules/openclaw" node_modules/openclaw
          sudo apt-get update
          sudo apt-get install -y keepassxc

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Format check
        run: npm run format:check

      - name: Harness check
        run: npm run check:harness

      - name: Doc freshness check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:docs -- --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Skills check
        run: npm run check:skills

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test with coverage
        run: |
          mkdir -p coverage
          npm run test:coverage | tee coverage/plugin-tests.txt

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
